name: Publish packages

on:
  push:
    branches: [ master ]
    tags:
    - 'v*.*.*'
  pull_request:
    branches: [ master ]

jobs:
  pkg-pr-new:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      run: npm run test

    - name: Publish package to pkg.pr.new
      run: npm exec -- pkg-pr-new publish "."

  publish:
    needs:
    - pkg-pr-new
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
        package-manager-cache: false

    - name: Configure release
      id: release
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        BASE_VERSION=$(node -p "require('./package.json').version")

        if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          echo "::error::Release tags must match vX.X.X or vX.X.X-prerelease, got $GITHUB_REF_NAME."
          exit 1
        fi

        PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
        if [[ "$PACKAGE_VERSION" != "$BASE_VERSION" ]]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $BASE_VERSION."
          exit 1
        fi

        if [[ "$PACKAGE_VERSION" == *-* ]]; then
          echo "npm_tag=next" >> "$GITHUB_OUTPUT"
        else
          echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
        fi

        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
          echo "already_published=true" >> "$GITHUB_OUTPUT"
        else
          echo "already_published=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish package to npm
      if: steps.release.outputs.already_published == 'false'
      run: npm publish --provenance --access public --tag "${{ steps.release.outputs.npm_tag }}"

    - name: Skip already published version
      if: steps.release.outputs.already_published == 'true'
      run: echo "$GITHUB_REF_NAME is already published; skipping npm publish."
